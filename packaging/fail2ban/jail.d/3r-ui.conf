# 3R-UI Fail2ban Jail Configuration
# Protects both SSH and 3r-ui Web Console from brute-force attacks.

[DEFAULT]
# Whitelist local loopback and trusted admin IPs
ignoreip = 127.0.0.1/8 ::1
bantime = 1d
findtime = 10m
maxretry = 5

[sshd]
enabled = true
port = ssh
# On systemd systems, journal backend is used; otherwise auth.log
backend = %(sshd_backend)s
maxretry = 3
bantime = 1d

[3r-ui]
enabled = true
port = 8443,http,https
filter = 3r-ui
# 3r-ui logs to systemd journal (SyslogIdentifier=3r-ui)
backend = systemd
journalmatch = _SYSTEMD_UNIT=3r-ui.service + SYSLOG_IDENTIFIER=3r-ui
maxretry = 5
findtime = 10m
bantime = 1d
