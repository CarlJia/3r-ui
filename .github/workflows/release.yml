name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: "debuginfo"
  CARGO_PROFILE_TEST_STRIP: "debuginfo"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"

jobs:
  test-and-lint:
    name: Run Tests & Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-test

      - name: Lint & Clippy
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test

      - name: Prune test binaries to minimize cache size
        if: always()
        run: |
          find target/debug/deps -maxdepth 1 -type f -executable -delete 2>/dev/null || true
          rm -rf target/debug/incremental 2>/dev/null || true

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: test-and-lint
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_name: 3r-ui-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            asset_name: 3r-ui-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-release-${{ matrix.target }}

      - name: Build release binary with cross
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          cp target/${{ matrix.target }}/release/3r-ui ${{ matrix.asset_name }}
          strip ${{ matrix.asset_name }} 2>/dev/null || true
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Attach to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.tar.gz.sha256
          fail_on_unmatched_files: true
