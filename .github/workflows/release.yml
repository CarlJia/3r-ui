name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Run Tests & Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Lint & Clippy
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: test-and-lint
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_name: 3r-ui-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            asset_name: 3r-ui-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build release binary with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          cp target/${{ matrix.target }}/release/3r-ui ${{ matrix.asset_name }}
          strip ${{ matrix.asset_name }} 2>/dev/null || true
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Attach to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.tar.gz.sha256
          fail_on_unmatched_files: true

  build-macos:
    name: Build macOS (aarch64)
    needs: test-and-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/cargo
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build release binary
        run: cargo build --release

      - name: Prepare asset
        run: |
          cp target/release/3r-ui 3r-ui-aarch64-apple-darwin
          strip 3r-ui-aarch64-apple-darwin 2>/dev/null || true
          tar -czvf 3r-ui-aarch64-apple-darwin.tar.gz 3r-ui-aarch64-apple-darwin
          shasum -a 256 3r-ui-aarch64-apple-darwin > 3r-ui-aarch64-apple-darwin.sha256
          shasum -a 256 3r-ui-aarch64-apple-darwin.tar.gz > 3r-ui-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 3r-ui-aarch64-apple-darwin
          path: |
            3r-ui-aarch64-apple-darwin
            3r-ui-aarch64-apple-darwin.tar.gz
            3r-ui-aarch64-apple-darwin.sha256
            3r-ui-aarch64-apple-darwin.tar.gz.sha256

      - name: Attach to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            3r-ui-aarch64-apple-darwin
            3r-ui-aarch64-apple-darwin.tar.gz
            3r-ui-aarch64-apple-darwin.sha256
            3r-ui-aarch64-apple-darwin.tar.gz.sha256
          fail_on_unmatched_files: true
