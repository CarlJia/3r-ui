name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: build linux x86_64 / arm64
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Linux Rust targets
        run: |
          rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip debug symbols
        run: strip target/${{ matrix.target }}/release/3r-ui

      - name: Smoke-test the binary
        run: |
          bin=target/${{ matrix.target }}/release/3r-ui
          test -x "$bin" || (echo "binary not executable: $bin" && exit 1)
          # Confirm the binary parses as ELF for the expected arch. The
          # panel has no --version flag, so we can't probe behaviour here —
          # any malformed binary would already have failed the cargo step.
          file "$bin" || true

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3r-ui-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/3r-ui

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/3r-ui
          fail_on_unmatched_files: true

  build-macos:
    name: build macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/cargo
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: 3r-ui-aarch64-apple-darwin
          path: target/release/3r-ui

  test:
    name: cargo test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check