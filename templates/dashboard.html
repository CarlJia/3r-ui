<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3R-UI 控制台</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7f9; color: #1c2024;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e6e8eb; }
      header, .card { background: #1e2126 !important; border-color: #2c3037 !important; }
      input, select { background: #16181d !important; color: #e6e8eb !important;
                      border-color: #2c3037 !important; }
      .btn-primary { background: #3b82f6 !important; }
      table { border-color: #2c3037 !important; }
      th, td { border-color: #2c3037 !important; }
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: #fff; border-bottom: 1px solid #e3e6ea;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header .who { font-size: 13px; opacity: .7; margin-right: 16px; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px; }
    .card {
      background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
      padding: 20px; margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .card .hint { margin: 0 0 16px; font-size: 13px; opacity: .65; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px;
      border: 1px solid #d5d9de; background: #fff; color: inherit; margin-bottom: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0 16px; }
    button, .btn {
      padding: 8px 14px; font-size: 14px; font-weight: 600; border: 0;
      border-radius: 8px; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2f6fd8; }
    .btn-secondary { background: #e8eaed; color: #1c2024; }
    .empty { font-size: 13px; opacity: .6; padding: 12px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eceef1; }
    th { font-weight: 600; opacity: .7; font-size: 12px; text-transform: uppercase; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px;
              font-size: 11px; font-weight: 600; }
    .status-active { background: #e3f5e9; color: #1a7f42; }
    .status-disabled { background: #fdecec; color: #a4262c; }
    @media (prefers-color-scheme: dark) {
      .status-active { background: #16351f !important; color: #6ee7a0 !important; }
      .status-disabled { background: #3a1f22 !important; color: #ff9b9b !important; }
      .btn-secondary { background: #2c3037 !important; color: #e6e8eb !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>3R-UI</h1>
    <div>
      <span class="who">{{ username }}</span>
      <form method="post" action="/admin/logout" style="display:inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="btn btn-secondary" type="submit">退出登录</button>
      </form>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>入站配置</h2>
      <p class="hint">VLESS + REALITY + XHTTP</p>
      <p>
        <a class="btn btn-primary" href="/admin/inbound">管理入站</a>
      </p>
    </section>
    <section class="card">
      <h2>用户管理</h2>
      <p class="hint">配额、过期时间与分享链接</p>
      <p>
        <a class="btn btn-primary" href="/admin/clients">管理用户</a>
      </p>
    </section>
  </main>
</body>
</html>
