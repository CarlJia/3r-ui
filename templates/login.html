<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3R-UI 登录</title>
  {% include "theme_head.html" %}
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7f9; color: #1c2024;
      position: relative;
    }
    .theme-corner {
      position: absolute; top: 18px; right: 20px;
    }
    .theme-toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; font-size: 12px; font-weight: 500;
      border: 1px solid #d5d9de; border-radius: 8px;
      background: #fff; color: #1c2024; cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover { background: #f4f5f7; border-color: #c4c8cd; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) body { background: #16181d; color: #e6e8eb; }
      html:not([data-theme="light"]) .card { background: #1e2126 !important; border-color: #2c3037 !important; }
      html:not([data-theme="light"]) input { background: #16181d !important; color: #e6e8eb !important;
                                             border-color: #2c3037 !important; }
      html:not([data-theme="light"]) label { color: #cbd5e1 !important; }
      html:not([data-theme="light"]) .error { background: #3a1f22 !important; color: #ff9b9b !important;
                                              border-color: #5c2b2f !important; }
      html:not([data-theme="light"]) .theme-toggle-btn { background: #1e2126; color: #cbd5e1; border-color: #2c3037; }
      html:not([data-theme="light"]) .theme-toggle-btn:hover { background: #272b32; color: #fff; }
    }
    html[data-theme="dark"] body { background: #16181d !important; color: #e6e8eb !important; }
    html[data-theme="dark"] .card { background: #1e2126 !important; border-color: #2c3037 !important; }
    html[data-theme="dark"] input { background: #16181d !important; color: #e6e8eb !important;
                                   border-color: #2c3037 !important; }
    html[data-theme="dark"] label { color: #cbd5e1 !important; }
    html[data-theme="dark"] .error { background: #3a1f22 !important; color: #ff9b9b !important;
                                    border-color: #5c2b2f !important; }
    html[data-theme="dark"] .theme-toggle-btn { background: #1e2126 !important; color: #cbd5e1 !important; border-color: #2c3037 !important; }
    html[data-theme="dark"] .theme-toggle-btn:hover { background: #272b32 !important; color: #fff !important; }

    html[data-theme="light"] body { background: #f6f7f9 !important; color: #1c2024 !important; }
    html[data-theme="light"] .card { background: #fff !important; border-color: #e3e6ea !important; }
    html[data-theme="light"] input { background: #fff !important; color: inherit !important; border-color: #d5d9de !important; }
    html[data-theme="light"] label { color: inherit !important; }
    html[data-theme="light"] .theme-toggle-btn { background: #fff !important; color: #1c2024 !important; border-color: #d5d9de !important; }

    .card {
      width: min(360px, calc(100vw - 32px)); background: #fff;
      border: 1px solid #e3e6ea; border-radius: 12px; padding: 32px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    .sub { margin: 0 0 24px; font-size: 13px; opacity: .65; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 11px; font-size: 14px; border-radius: 8px;
      border: 1px solid #d5d9de; background: #fff; color: inherit;
      margin-bottom: 16px;
    }
    input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; }
    button.btn-submit {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      border: 0; border-radius: 8px; background: #3b82f6; color: #fff;
      cursor: pointer;
    }
    button.btn-submit:hover { background: #2f6fd8; }
    .error {
      background: #fdecec; border: 1px solid #f5c2c2; color: #a4262c;
      border-radius: 8px; padding: 9px 11px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="theme-corner">
    <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="切换主题模式" title="点击切换：自动 / 深色 / 浅色">
      <span class="theme-toggle-icon" id="theme-toggle-icon">🌓</span>
      <span class="theme-toggle-label" id="theme-toggle-label">跟随系统</span>
    </button>
  </div>
  <main class="card">
    <h1>3R-UI</h1>
    <p class="sub">xray-core 管理面板</p>
    {% if let Some(err) = error %}
    <div class="error" role="alert">{{ err }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn-submit" type="submit">登录</button>
    </form>
  </main>

  <script>
    (function () {
      const THEME_KEY = '3r-ui-theme';
      function getMode() {
        try {
          return localStorage.getItem(THEME_KEY) || 'auto';
        } catch (e) {
          return 'auto';
        }
      }
      function updateUI(mode) {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', mode);

        const icon = document.getElementById('theme-toggle-icon');
        const label = document.getElementById('theme-toggle-label');
        if (icon && label) {
          if (mode === 'dark') {
            icon.textContent = '🌙';
            label.textContent = '深色模式';
          } else if (mode === 'light') {
            icon.textContent = '☀️';
            label.textContent = '浅色模式';
          } else {
            icon.textContent = prefersDark ? '🌓' : '🌗';
            label.textContent = '跟随系统';
          }
        }
      }

      updateUI(getMode());

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          if (getMode() === 'auto') {
            updateUI('auto');
          }
        });
      }

      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.addEventListener('click', function () {
          const cur = getMode();
          let next = 'auto';
          if (cur === 'auto') {
            next = 'dark';
          } else if (cur === 'dark') {
            next = 'light';
          } else {
            next = 'auto';
          }
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (e) {}
          updateUI(next);
        });
      }
    })();
  </script>
</body>
</html>
