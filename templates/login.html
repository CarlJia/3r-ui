<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3R-UI 登录</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7f9; color: #1c2024;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e6e8eb; }
      .card { background: #1e2126 !important; border-color: #2c3037 !important; }
      input { background: #16181d !important; color: #e6e8eb !important;
              border-color: #2c3037 !important; }
      .error { background: #3a1f22 !important; color: #ff9b9b !important;
               border-color: #5c2b2f !important; }
    }
    .card {
      width: min(360px, calc(100vw - 32px)); background: #fff;
      border: 1px solid #e3e6ea; border-radius: 12px; padding: 32px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    .sub { margin: 0 0 24px; font-size: 13px; opacity: .65; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 11px; font-size: 14px; border-radius: 8px;
      border: 1px solid #d5d9de; background: #fff; color: inherit;
      margin-bottom: 16px;
    }
    input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; }
    button {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      border: 0; border-radius: 8px; background: #3b82f6; color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2f6fd8; }
    .error {
      background: #fdecec; border: 1px solid #f5c2c2; color: #a4262c;
      border-radius: 8px; padding: 9px 11px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>3R-UI</h1>
    <p class="sub">xray-core 管理面板</p>
    {% if let Some(err) = error %}
    <div class="error" role="alert">{{ err }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
