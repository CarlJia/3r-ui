[package]
name = "three-r-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Self-hosted Rust xray-core management panel"
license = "GPL-3.0-or-later"

[lib]
name = "three_r_ui"
path = "src/lib.rs"

[[bin]]
name = "3r-ui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }
askama = "0.12"
bcrypt = "0.15"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "macros"] }
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tonic = "0.12"
prost = "0.13"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
instant-acme = "0.7"
rcgen = "0.13"
x509-parser = "0.16"
pingora-core = { version = "0.9", features = ["openssl"] }
pingora-proxy = { version = "0.9", features = ["openssl"] }
pingora-http = "0.9"
http = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
protoc-bin-vendored = "3"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
